[project]
name = "examos-backend"
version = "0.1.0"
description = "ExamOS - personalized exam super-agent backend (FastAPI + SQLAlchemy + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "langgraph>=0.2",
  "sympy>=1.13",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgserver>=0.1.4", "langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*"]
