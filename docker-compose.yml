services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: examos
      POSTGRES_PASSWORD: examos
      POSTGRES_DB: examos
    volumes:
      - examos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examos -d examos"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build:
      context: ./backend
    environment:
      EXAMOS_DATABASE_URL: postgresql+psycopg://examos:examos@db:5432/examos
      EXAMOS_DAILY_MINUTES: "240"
      EXAMOS_LLM_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  examos_pgdata:
